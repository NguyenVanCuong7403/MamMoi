<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin đã trả lời</title>
</head>

<body style='font-family: Arial, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0;'>
    <div style='max-width: 600px; margin: 0 auto; padding: 20px;'>
        <h2 style='color: #27ae60;'>✅ Yêu cầu hỗ trợ đã được trả lời</h2>
        <p>Xin chào <strong>{{UserName}}</strong>,</p>
        <p>Yêu cầu hỗ trợ của bạn đã được Admin xử lý:</p>

        <div style='background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px 0;'>
            <p style='margin: 8px 0;'><strong>Ticket:</strong> <span style='color: #3498db;'>#{{TicketNumber}}</span>
            </p>
            <p style='margin: 8px 0;'><strong>Tiêu đề:</strong> {{Subject}}</p>
        </div>

        <div style='background: #e8f5e9; padding: 20px; border-left: 4px solid #27ae60; margin: 20px 0;'>
            <h3 style='margin-top: 0; color: #27ae60;'>Phản hồi từ Admin:</h3>
            <p style='white-space: pre-wrap;'>{{Resolution}}</p>
        </div>

        <p>Nếu bạn cần thêm hỗ trợ, vui lòng trả lời email này hoặc tạo yêu cầu mới.</p>
        <p style='margin-top: 30px;'>Trân trọng,</p>
        <p><strong>Đội ngũ MamMoi 🌱</strong></p>
    </div>
</body>

</html>
