<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Request Mới</title>
</head>

<body style='font-family: Arial, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0;'>
    <div style='max-width: 600px; margin: 0 auto; padding: 20px;'>
        <h2 style='color: #2c3e50;'>🆕 Support Request Mới</h2>
        <div style='background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px 0;'>
            <p style='margin: 8px 0;'><strong>Ticket:</strong> <span style='color: #3498db;'>#{{TicketNumber}}</span>
            </p>
            <p style='margin: 8px 0;'><strong>Người gửi:</strong> {{UserName}}</p>
            <p style='margin: 8px 0;'><strong>Tiêu đề:</strong> {{Subject}}</p>
            <p style='margin: 8px 0;'><strong>Danh mục:</strong> {{Category}}</p>
            <p style='margin: 8px 0;'><strong>Độ ưu tiên:</strong> <span
                    style='color: {{PriorityColor}}; font-weight: bold;'>{{Priority}}</span></p>
        </div>
        <p>Vui lòng truy cập Admin Panel để xem chi tiết và trả lời yêu cầu hỗ trợ này.</p>
        <p style='margin-top: 30px;'>Trân trọng,</p>
        <p><strong>Hệ thống MamMoi</strong></p>
    </div>
</body>

</html>
